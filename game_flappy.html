
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>تفاصيل لعبة Flappy Bird Egypt</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            direction: rtl;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 2.2em;
            color: #FFD700;
        }

        .game-media {
            text-align: center;
            margin-top: 20px;
        }

        .game-media img {
            width: 90%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .game-media iframe {
            width: 100%;
            height: 220px;
            border: none;
            border-radius: 10px;
        }

        .desc {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .btn {
            display: block;
            background: #4CAF50;
            color: white;
            text-align: center;
            padding: 12px 20px;
            border-radius: 5px;
            margin: 30px auto;
            width: fit-content;
            font-size: 1.2em;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #ccc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Flappy Bird Egypt</div>

        <div class="game-media">
            <img src="flappy_bird_egypt.jpg" alt="لقطة من اللعبة" />
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>

        <div class="desc">
            انطلق في مغامرة مليئة بالتحدي مع Flappy Bird Egypt بتصميم مصري فريد!<br>
            الإصدار: 1.0.0<br>
            الحجم: 52.5MB
        </div>

        <a href="https://drive.google.com/uc?export=download&id=1e8eXRAoZq-aN8299LI9vIp-4F3wCoRiJ" target="_blank" class="btn">تحميل اللعبة</a>

        <div class="back">
            <a href="index.html">← رجوع للصفحة الرئيسية</a>
        </div>
    </div>
</body>
</html>
