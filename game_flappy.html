
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لعبة Flappy Bird Egypt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: white;
            text-align: center;
            padding: 20px;
            direction: rtl;
        }
        .game-img {
            width: 200px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .rating span {
            cursor: pointer;
            font-size: 24px;
        }
        .download-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: green;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>لعبة Flappy Bird Egypt</h1>
    <img src="flappy_bird_egypt.jpg" class="game-img" alt="صورة اللعبة" />

    <p>الإصدار: 1.0.0 | الحجم: 52.5MB</p>
    <p>تجنب العقبات واجمع النقاط في رحلة مثيرة!</p>

    <!-- زر التحميل -->
    <a href="https://drive.google.com/uc?export=download&id=1e8eXRAoZq-aN8299LI9vIp-4F3wCoRiJ" class="download-button" onclick="trackDownload()">تحميل اللعبة</a>
    <p>عدد التحميلات: <span id="download-count">0</span></p>

    <!-- التقييم -->
    <div id="rating">
        <p>قيّم اللعبة:</p>
        <div class="rating">
            <span onclick="submitRating(1)">⭐</span>
            <span onclick="submitRating(2)">⭐⭐</span>
            <span onclick="submitRating(3)">⭐⭐⭐</span>
            <span onclick="submitRating(4)">⭐⭐⭐⭐</span>
            <span onclick="submitRating(5)">⭐⭐⭐⭐⭐</span>
        </div>
        <p id="rating-result">لم يتم التقييم بعد</p>
    </div>

    <!-- عدد الزوار -->
    <p>عدد الزوار الآن: <span id="live-users"></span></p>

    <script>
        function submitRating(stars) {
            localStorage.setItem('game_rating', stars);
            document.getElementById('rating-result').innerText = "تم التقييم بـ " + stars + " نجمة";
        }

        function trackDownload() {
            let count = localStorage.getItem('downloads') || 0;
            count++;
            localStorage.setItem('downloads', count);
            document.getElementById('download-count').innerText = count;
        }

        window.onload = function () {
            const rating = localStorage.getItem('game_rating');
            if (rating) {
                document.getElementById('rating-result').innerText = "تم التقييم بـ " + rating + " نجمة";
            }

            let count = localStorage.getItem('downloads') || 0;
            document.getElementById('download-count').innerText = count;

            const randomUsers = Math.floor(Math.random() * 20) + 1;
            document.getElementById("live-users").innerText = randomUsers;
        }
    </script>
</body>
</html>
