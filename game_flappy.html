
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Egypt - تفاصيل اللعبة</title>
    <style>
        
    body {
        background: linear-gradient(-45deg, #1e1e2f, #2d2d44, #3f51b5, #00bcd4);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    body {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1f1f2e, #2e2e48);
            color: #fff;
            direction: rtl;
        }

        .container {
            max-width: 90%;
            margin: auto;
            padding: 20px;
        }

        .game-header {
            text-align: center;
        }

        .game-header h1 {
            font-size: 2.5em;
            color: #FFD700;
        }

        .game-media {
            margin-top: 20px;
            text-align: center;
        }

        .game-media img {
            width: 80%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .game-media iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 10px;
        }

        .description {
            margin-top: 25px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
        }

        .download-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 5px;
            width: fit-content;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>Flappy Bird Egypt</h1>
        </div>

        <div class="game-media">
            <img src="flappy_bird_egypt.jpg" alt="صورة من داخل اللعبة">
            

        <div class="description">
            <p>انطلق في مغامرة ممتعة مع Flappy Bird Egypt! هذه النسخة مستوحاة من اللعبة الأصلية لكن بتصميم مصري، وتحديات ممتعة. تفادى العوائق، واجمع النقاط ونافس أصدقائك!</p>
            <p>الحجم: 52.50MB | الإصدار: 1.0.0</p>
        </div>

        <a href="" target="_blank">تحميل اللعبة</a>
        <a href="index.html" class="back-link">⟵ رجوع إلى الصفحة الرئيسية</a>
    </div>
