
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مكتبة ألعاب SHENO</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #1e1e2f, #2d2d44, #3f51b5, #00bcd4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            direction: rtl;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            color: #FFD700;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 30px 0;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .game-card:hover {
            transform: scale(1.02);
        }

        .game-image img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            font-size: 1.5em;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .game-description {
            color: #ddd;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9em;
            color: #ccc;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في مكتبة ألعاب SHENO 👑</h1>

        <a href="game_flappy.html">
            <div class="game-card">
                <div class="game-image">
                    <img src="flappy_bird_egypt.jpg" alt="Flappy Bird Egypt" />
                </div>
                <div class="game-info">
                    <div class="game-title">Flappy Bird Egypt</div>
                    <div class="game-description">
                        لعبة Flappy Bird الشهيرة بتصميم مصري مميز! تفادى العوائق، واجمع النقاط ونافس أصدقائك.
                    </div>
                </div>
            </div>
        </a>

        <div class="footer">© 2025 تم تطويره بواسطة SHENO</div>
    </div>
</body>
</html>
